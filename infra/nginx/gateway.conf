# Шлюз spliti.uz: статика фронта + /api, /sanctum, /up → php-fpm. Перед ним — Nginx Proxy Manager (TLS).
map $http_host $spliti_www { default 0; "www.spliti.uz" 1; }

server {
    listen 80;
    server_name spliti.uz www.spliti.uz _;
    root /srv/web;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    if ($spliti_www) { return 301 https://spliti.uz$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # бэкенд: API, CSRF-кука Sanctum, проверка живости
    location ^~ /api/     { try_files /nonexistent @php; }
    location ^~ /sanctum/ { try_files /nonexistent @php; }
    location = /up        { try_files /nonexistent @php; }
    location @php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 30s;
    }

    # сборка Vite: имена с хешем — кеш на год
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
    location ^~ /brand/  { expires 7d; }

    # 3D-демо и CRM — не для поисковиков
    location = /demo { return 301 /demo/; }
    location ^~ /demo/ { add_header X-Robots-Tag "noindex" always; try_files $uri /demo/index.html; }
    location = /crm { return 301 /crm/; }
    location ^~ /crm/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store" always;
        try_files $uri /crm/index.html;
    }

    # сайт Spliti
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
