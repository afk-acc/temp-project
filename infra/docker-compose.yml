# Spliti (spliti.uz) на сервере edu_start: сайт Spliti, 3D-демо и CRM + Laravel-бэкенд на SQLite.
# Наружу — только шлюз на 172.17.0.1:18095 (мост Docker, из интернета не виден); домен и TLS — в Nginx Proxy Manager.
# Раскладка на сервере: /home/projects/spliti/{backend,infra,web,import,data}. Выкладка — infra/deploy.sh с мака.
name: spliti

x-base: &base
  restart: unless-stopped
  cpu_shares: 512
  oom_score_adj: 200
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  app:
    <<: *base
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    image: spliti/app:latest
    env_file: .env.app
    volumes:
      - ../data/db:/var/www/html/database/data          # SQLite: квартиры, статусы, заявки, контент сайта
      - ../data/storage:/var/www/html/storage/app       # картинки ЖК, логотипы, картинки сайта
      - ../import:/import:ro                            # пакет конвейера для zhk:import (только публикуемые ЖК)
    mem_limit: 192m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  gateway:
    <<: *base
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "172.17.0.1:18095:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web:/srv/web:ro                              # собранный фронт (vite build)
    mem_limit: 48m
    cpus: 0.5
